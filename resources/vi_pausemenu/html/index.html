<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>vi_pausemenu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- the menu: a 16:9 frame in the middle of the screen, over a shade on the blurred game -->
    <div id="root">
        <div id="shade"></div>
        <div id="frame">
            <div id="stats">
                <div class="stat"><div class="k" id="st-day"></div><div class="v" id="st-time"></div></div>
                <div class="stat"><div class="k">Cash</div><div class="v" id="st-cash"></div></div>
                <div class="stat"><div class="k">Bank</div><div class="v" id="st-bank"></div></div>
            </div>
            <div id="heading"></div>
            <div id="who">
                <div id="mode"></div>
                <div id="name"></div>
            </div>
            <!-- the character's face, as the character switcher and the honor panel show it; initials until it comes -->
            <div id="mug" class="mug"><span class="initials"></span><img alt="" hidden></div>

            <!-- home: the tiles -->
            <div id="grid"></div>

            <!-- settings, brief, stats, players, report: a list on the left, a picture and a line on the right -->
            <div id="list"><div id="rows"></div></div>
            <div id="preview">
                <div id="pic"><textarea id="report-text" maxlength="1500" placeholder="What happened? Who, where and when helps."></textarea></div>
                <div id="pv-title"></div>
                <div id="pv-bar"><b></b></div>
                <div id="pv-desc"></div>
            </div>

            <div id="title"></div>
            <div id="prompts" class="prompts"></div>

            <div id="confirm">
                <div class="box">
                    <div class="c-title">Disconnect</div>
                    <div class="c-text">Leave the server now?</div>
                    <div class="prompts" id="confirm-prompts"></div>
                </div>
            </div>
            <div id="toast"></div>
        </div>
    </div>

    <!-- the map: single player's pause map, drawn by app.js (its pictures and their atlas in img/map) -->
    <div id="pmap"><canvas id="pmap-canvas"></canvas></div>

    <script src="img/map/atlas.js"></script>
    <script src="app.js"></script>
</body>
</html>
