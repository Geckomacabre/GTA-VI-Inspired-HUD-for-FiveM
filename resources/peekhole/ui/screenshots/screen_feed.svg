<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 780" font-family="Arial,Helvetica,sans-serif">
  <!-- Background -->
  <rect width="390" height="780" fill="#f3f4f6"/>

  <!-- Top nav -->
  <rect width="390" height="52" fill="#00AFF0"/>
  <text x="14" y="34" font-size="20" font-weight="900" font-style="italic" fill="white">Peekhole</text>
  <text x="300" y="34" font-size="11" fill="rgba(255,255,255,0.85)">Michael D.</text>

  <!-- Tab bar -->
  <rect y="52" width="390" height="42" fill="white"/>
  <rect y="52" width="390" height="1" fill="#e0e0e0"/>
  <!-- Home tab active -->
  <text x="65" y="72" font-size="11" fill="#00AFF0" text-anchor="middle">⌂</text>
  <text x="65" y="88" font-size="9" fill="#00AFF0" text-anchor="middle">Home</text>
  <rect x="0" y="91" width="130" height="3" fill="#00AFF0" rx="1"/>
  <!-- Discover -->
  <text x="195" y="72" font-size="11" fill="#6b7280" text-anchor="middle">⌕</text>
  <text x="195" y="88" font-size="9" fill="#6b7280" text-anchor="middle">Discover</text>
  <!-- My Page -->
  <text x="325" y="72" font-size="11" fill="#6b7280" text-anchor="middle">♟</text>
  <text x="325" y="88" font-size="9" fill="#6b7280" text-anchor="middle">My Page</text>
  <rect y="93" width="390" height="1" fill="#e0e0e0"/>

  <!-- Post card 1 -->
  <rect y="102" width="390" height="200" fill="white"/>
  <circle cx="46" cy="122" r="16" fill="#00AFF0"/>
  <text x="46" y="127" font-size="12" text-anchor="middle" fill="white">SK</text>
  <text x="70" y="120" font-size="13" font-weight="700" fill="#1a1a1a">SunsetKing</text>
  <text x="70" y="134" font-size="11" fill="#6b7280">2h</text>
  <text x="14" y="156" font-size="12" fill="#1a1a1a">Golden hour vibes only 🌅✨</text>
  <rect y="166" width="390" height="120" fill="#ffcc88" rx="0"/>
  <text x="195" y="238" font-size="36" text-anchor="middle">🌅</text>
  <rect y="285" width="390" height="1" fill="#e0e0e0"/>
  <rect y="295" width="390" height="8" fill="#f3f4f6"/>

  <!-- Post card 2 — locked -->
  <rect y="303" width="390" height="200" fill="white"/>
  <circle cx="46" cy="323" r="16" fill="#ec4899"/>
  <text x="46" y="328" font-size="12" text-anchor="middle" fill="white">NV</text>
  <text x="70" y="321" font-size="13" font-weight="700" fill="#1a1a1a">NightVibe</text>
  <text x="70" y="335" font-size="11" fill="#6b7280">5h</text>
  <text x="14" y="357" font-size="12" fill="#1a1a1a">Late night content 🌙</text>
  <!-- locked media -->
  <rect y="367" width="390" height="110" fill="#111"/>
  <text x="195" y="404" font-size="28" text-anchor="middle">🔒</text>
  <text x="195" y="432" font-size="11" text-anchor="middle" fill="#cccccc">Unlock to view this post</text>
  <!-- unlock button -->
  <rect x="130" y="443" width="130" height="26" rx="13" fill="#00AFF0"/>
  <text x="195" y="461" font-size="11" text-anchor="middle" font-weight="700" fill="white">Unlock · $500</text>

  <!-- Post card 3 -->
  <rect y="510" width="390" height="200" fill="white"/>
  <circle cx="46" cy="530" r="16" fill="#8b5cf6"/>
  <text x="46" y="535" font-size="12" text-anchor="middle" fill="white">CG</text>
  <text x="70" y="528" font-size="13" font-weight="700" fill="#1a1a1a">CityGlow</text>
  <text x="70" y="542" font-size="11" fill="#6b7280">1d</text>
  <text x="14" y="564" font-size="12" fill="#1a1a1a">Downtown shoots are unmatched 📸</text>
  <rect y="574" width="390" height="116" fill="#334155"/>
  <text x="195" y="642" font-size="36" text-anchor="middle">🌃</text>
  <rect y="688" width="390" height="1" fill="#e0e0e0"/>

  <!-- Label -->
  <rect y="730" width="390" height="50" fill="white" opacity="0.9"/>
  <text x="195" y="761" font-size="13" font-weight="700" fill="#00AFF0" text-anchor="middle">Home Feed — Posts from your subscriptions</text>
